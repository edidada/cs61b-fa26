dependencies { implementation 'io.javalin:javalin:7.2.3'; runtimeOnly 'org.slf4j:slf4j-simple:2.0.17' }
test { exclude '**/TestJankyOomage.class' }
tasks.register('expectedFailure', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/TestJankyOomage.class'
    workingDir = projectDir
    ignoreFailures = true
}
