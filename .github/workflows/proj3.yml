name: CS61B Project 3
on:
  push:
    branches: [edidada/proj3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tool: [maven, gradle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Fetch pinned official course library
        shell: bash
        run: |
          mkdir -p proj3/libs
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Berkeley-CS61B/library-fa26/7d9a380f3d881630a8cbf6382945a2d27618e728/algs4.jar -o proj3/libs/algs4.jar
          test "$(git hash-object proj3/libs/algs4.jar)" = e1703efb7a09c244fdfb0ee3d08aa7c28e1b408c
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file -Dfile=proj3/libs/algs4.jar -DgroupId=edu.princeton.cs -DartifactId=algs4 -Dversion=fa26-pinned -Dpackaging=jar -DgeneratePom=true
      - name: Maven original tests
        if: matrix.tool == 'maven'
        run: mvn -B -f proj3/pom.xml test
      - name: Gradle original tests
        if: matrix.tool == 'gradle'
        run: gradle -p proj3 test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proj3-${{ matrix.tool }}
          path: |
            proj3/target/surefire-reports/
            proj3/build/test-results/


