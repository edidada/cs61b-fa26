name: CS61B Lab 10
on:
  push:
    branches: [edidada/lab10]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [maven, gradle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: python scripts/setup_dependencies.py
      - if: matrix.tool == 'maven'
        run: mvn -B -pl lab10 test
      - if: matrix.tool == 'gradle'
        run: gradle :lab10:test --no-daemon
      - name: Verify explicitly expected red demonstration
        run: python scripts/check_expected_failure.py "${{ matrix.tool }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab10-${{ matrix.tool }}-reports
          path: |
            lab10/target/surefire-reports/
            lab10/build/reports/tests/
            lab10/build/test-results/
