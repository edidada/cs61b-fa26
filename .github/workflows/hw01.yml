name: CS61B HW01
on:
  push:
    branches: [edidada/hw01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tool: [maven, gradle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Maven original tests
        if: matrix.tool == 'maven'
        run: mvn -B -f hw01/pom.xml test
      - name: Gradle original tests
        if: matrix.tool == 'gradle'
        run: gradle -p hw01 test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw01-${{ matrix.tool }}
          path: |
            hw01/target/surefire-reports/
            hw01/build/test-results/
