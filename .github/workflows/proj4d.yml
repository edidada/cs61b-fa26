name: CS61B Project 4D
on:
  push:
    branches: [edidada/proj4d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [maven, gradle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Official dependencies and data
        run: |
          pip install gdown==5.2.0
          bash scripts/fetch_proj4c.sh
      - name: Maven tests
        if: matrix.tool == 'maven'
        run: mvn -B -f proj4cd/pom.xml test
      - name: Gradle tests
        if: matrix.tool == 'gradle'
        run: gradle -p proj4cd test --no-daemon
      - uses: actions/setup-node@v4
        if: matrix.tool == 'maven'
        with:
          node-version: '22'
      - name: Browser acceptance dependencies
        if: matrix.tool == 'maven'
        run: |
          npm install --prefix .ci-browser playwright@1.56.1 --no-package-lock
          .ci-browser/node_modules/.bin/playwright install chromium
      - name: Real HTTP endpoints
        run: bash scripts/verify_proj4d_http.sh '${{ matrix.tool }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proj4d-${{ matrix.tool }}
          path: |
            proj4cd/target/surefire-reports/
            proj4cd/build/test-results/
            proj4cd/evidence/
