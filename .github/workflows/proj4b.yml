name: CS61B Project 4B Design Archive
on:
  push:
    branches: [edidada/proj4b]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-design:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: proj4b-design-markdown
          path: reports/proj4b-design.md
          if-no-files-found: error
