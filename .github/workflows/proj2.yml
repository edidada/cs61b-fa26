name: CS61B Project 2
on:
  push:
    branches: [edidada/proj2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tool: [maven, gradle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Maven supplementary tests
        if: matrix.tool == 'maven'
        run: mvn -B -f proj2/pom.xml test
      - name: Gradle supplementary tests
        if: matrix.tool == 'gradle'
        run: gradle -p proj2 test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proj2-${{ matrix.tool }}
          path: |
            proj2/target/surefire-reports/
            proj2/build/test-results/



