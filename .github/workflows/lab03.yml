name: CS61B Lab 03
on:
  push:
    branches: [edidada/lab03]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [maven, gradle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: python scripts/setup_dependencies.py
      - if: matrix.tool == 'maven'
        run: mvn -B -pl lab03 test
      - if: matrix.tool == 'gradle'
        run: gradle :lab03:test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab03-${{ matrix.tool }}-reports
          path: |
            lab03/target/surefire-reports/
            lab03/build/reports/tests/
