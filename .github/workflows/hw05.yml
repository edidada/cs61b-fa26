name: CS61B HW05
on:
  push:
    branches: [edidada/hw05-independent]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tool: [maven, gradle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Fetch pinned official course library
        shell: bash
        run: |
          mkdir -p hw05/libs
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Berkeley-CS61B/library-fa26/7d9a380f3d881630a8cbf6382945a2d27618e728/algs4.jar -o hw05/libs/algs4.jar
          test "$(git hash-object hw05/libs/algs4.jar)" = e1703efb7a09c244fdfb0ee3d08aa7c28e1b408c
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file -Dfile=hw05/libs/algs4.jar -DgroupId=edu.princeton.cs -DartifactId=algs4 -Dversion=fa26-pinned -Dpackaging=jar -DgeneratePom=true
      - name: Maven original tests
        if: matrix.tool == 'maven'
        run: mvn -B -f hw05/pom.xml test
      - name: Gradle original tests
        if: matrix.tool == 'gradle'
        run: gradle -p hw05 test --no-daemon
      - name: Original interactive timing experiment
        shell: bash
        run: |
          if [ '${{ matrix.tool }}' = maven ]; then
            bash scripts/measure_hw05.sh hw05/target/classes hw05/target/test-classes hw05/libs/algs4.jar hw05/timing
          else
            bash scripts/measure_hw05.sh hw05/build/classes/java/main hw05/build/classes/java/test hw05/libs/algs4.jar hw05/timing
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw05-${{ matrix.tool }}
          path: |
            hw05/target/surefire-reports/
            hw05/build/test-results/
            hw05/timing/


