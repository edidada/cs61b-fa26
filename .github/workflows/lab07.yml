name: CS61B Lab 07
on:
  push:
    branches: [edidada/lab07]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [maven, gradle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: python scripts/setup_dependencies.py
      - if: matrix.tool == 'maven'
        run: mvn -B -pl lab07 test
      - if: matrix.tool == 'gradle'
        run: gradle :lab07:test --no-daemon
      - name: Measure all five experiments and export plots
        if: matrix.tool == 'maven'
        working-directory: lab07
        run: mvn -B org.codehaus.mojo:exec-maven-plugin:3.5.0:java -Dexec.mainClass=timing.Experiments -Djava.awt.headless=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab07-${{ matrix.tool }}-reports
          path: |
            lab07/target/surefire-reports/
            lab07/build/reports/tests/
            lab07/results/
